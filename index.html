<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="民雄國中課表查詢系統">
    <meta name="robots" content="noindex">
    <title>民雄國中 課表查詢</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* 綁課儲存格背景警示色 */
        .td-cell.cell-locked {
            background-color: #fff3f3 !important;
            border: 1px solid #ffcccb;
        }

        /* 🔒 綁課 Badge 標籤 */
        .lock-tag {
            display: inline-block;
            background-color: #e63946;
            color: #ffffff;
            font-size: 0.72rem;
            padding: 1px 5px;
            border-radius: 4px;
            margin-left: 4px;
            vertical-align: middle;
            font-weight: bold;
            line-height: 1.2;
        }
    </style>
</head>
<body>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" style="display: none;">
        <div class="big-spinner"></div>
        <p>正在載入課表資料，請稍候⋯</p>
    </div>

    <!-- ══ 1. 登入視圖 ══════════════════════════════════════ -->
    <div id="loginView" class="view active" style="display: flex;">
        <div class="glass-card login-card">
            <div class="login-logo">
                <div class="logo-icon">📅</div>
                <h1 id="schoolName">嘉義縣民雄國中</h1>
                <p id="schoolSubtitle">課表查詢系統</p>
            </div>
            <form id="loginForm" autocomplete="off">
                <div class="form-group">
                    <label for="semesterSelect">學期</label>
                    <select id="semesterSelect" class="form-control"></select>
                </div>
                
                <div id="loginError" class="alert alert-danger" role="alert" style="display: none;"></div>
                
                <button type="submit" id="loginBtn" class="btn btn-primary btn-block" style="margin-top:1.25rem">
                    <span id="loginSpinner" class="spinner" style="display: none;"></span>
                    登入查詢
                </button>
            </form>
        </div>
    </div>

    <!-- ══ 2. 查詢視圖 ══════════════════════════════════════ -->
    <div id="queryView" class="view" style="display: none;">
        <div class="glass-card query-card">

            <!-- 標題列 -->
            <div class="query-header">
                <div>
                    <h2>課表查詢</h2>
                    <span id="currentSemester" class="semester-badge"></span>
                </div>
                <button class="btn btn-ghost logout-btn" onclick="logout()">登出</button>
            </div>

            <!-- 分頁切換 -->
            <div class="tab-bar">
                <button class="tab-btn active" id="tabClass" onclick="switchTab('class')">
                    🏫 班級查詢
                </button>
                <button class="tab-btn" id="tabTeacher" onclick="switchTab('teacher')">
                    👤 教師查詢
                </button>
            </div>

            <!-- 班級查詢 -->
            <div id="panelClass" class="tab-panel">
                <div class="grade-group">
                    <div class="grade-label grade-7">七年級</div>
                    <select id="sel7" class="form-control grade-select">
                        <option value="">— 選擇班級 —</option>
                    </select>
                </div>
                <div class="grade-group">
                    <div class="grade-label grade-8">八年級</div>
                    <select id="sel8" class="form-control grade-select">
                        <option value="">— 選擇班級 —</option>
                    </select>
                </div>
                <div class="grade-group">
                    <div class="grade-label grade-9">九年級</div>
                    <select id="sel9" class="form-control grade-select">
                        <option value="">— 選擇班級 —</option>
                    </select>
                </div>
                <div class="grade-group">
                    <div class="grade-label grade-sp">特殊班</div>
                    <select id="selSp" class="form-control grade-select">
                        <option value="">— 選擇班級 —</option>
                    </select>
                </div>
                <div id="classError" class="alert alert-warning" style="display: none;"></div>
                <button class="btn btn-success btn-block" style="margin-top:1rem" onclick="submitClassQuery()">
                    查 詢
                </button>
            </div>

            <!-- 教師查詢 -->
            <div id="panelTeacher" class="tab-panel hidden" style="display: none;">
                <div class="form-group">
                    <label for="subjectSelect">科目</label>
                    <select id="subjectSelect" class="form-control" onchange="onSubjectChange()">
                        <option value="">— 選擇科目 —</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="teacherSelect">教師</label>
                    <select id="teacherSelect" class="form-control">
                        <option value="">— 請先選擇科目 —</option>
                    </select>
                </div>
                <div id="teacherError" class="alert alert-warning" style="display: none;"></div>
                <button class="btn btn-success btn-block" style="margin-top:1rem" onclick="submitTeacherQuery()">
                    查 詢
                </button>
            </div>

        </div>
    </div>

    <!-- ══ 3. 結果視圖 ══════════════════════════════════════ -->
    <div id="resultView" class="view" style="display: none;">
        <div class="result-inner">

            <!-- 操作列 -->
            <div class="action-bar">
                <div class="action-bar-left">
                    <button id="backBtn" class="btn btn-ghost" onclick="goBack()">
                        ← 上一頁
                    </button>
                    <button class="btn btn-ghost" onclick="showQueryView()">
                        🔍 查詢
                    </button>
                </div>
                <div class="action-bar-right">
                    <button class="btn btn-print" onclick="printSchedule()">
                        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" fill="currentColor" viewBox="0 0 16 16">
                            <path d="M5 1a2 2 0 0 0-2 2v1h10V3a2 2 0 0 0-2-2H5zm6 8H5a1 1 0 0 0-1 1v3a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-3a1 1 0 0 0-1-1z"/>
                            <path d="M0 7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2h-1v-2a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v2H2a2 2 0 0 1-2-2V7zm2.5 1a.5.5 0 1 0 0-1 .5.5 0 0 0 0 1z"/>
                        </svg>
                        列印
                    </button>
                </div>
            </div>

            <h2 id="scheduleTitle" class="schedule-title"></h2>
            <div class="glass-card" style="padding:0; overflow:hidden;">
                <div id="scheduleTableContainer" class="table-wrapper"></div>
            </div>
        </div>
    </div>

    <!-- 載入配置與主程式 -->
    <script src="config.js"></script>
    <script src="app.js"></script>
    <script>
        // 加入防呆安全檢查，確保 CONFIG 存在時才寫入文字
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof CONFIG !== 'undefined') {
                if (CONFIG.SCHOOL_NAME) {
                    document.title = CONFIG.SCHOOL_NAME + ' 課表查詢';
                    const elName = document.getElementById('schoolName');
                    if (elName) elName.textContent = CONFIG.SCHOOL_NAME;
                }
                if (CONFIG.SCHOOL_SUBTITLE) {
                    const elSub = document.getElementById('schoolSubtitle');
                    if (elSub) elSub.textContent = CONFIG.SCHOOL_SUBTITLE;
                }
            }
        });
    </script>
</body>
</html>
